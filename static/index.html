<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NomerX</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d14;color:#f5f6fa;font-family:system-ui,-apple-system,sans-serif}main{max-width:520px;margin:auto;padding:20px}.logo{font-size:28px;font-weight:900;letter-spacing:2px;color:#a99bff}.panel{background:#171a27;border:1px solid #303448;border-radius:18px;padding:18px;margin:14px 0}.coins{font-size:28px;font-weight:800;color:#ffd66b}.btn{border:0;border-radius:12px;padding:14px 18px;background:#7667ff;color:white;font-size:16px;font-weight:700;width:100%;margin-top:10px}.btn.secondary{background:#2a2e40}.car{padding:12px;border-radius:12px;background:#202438;margin:8px 0;display:flex;justify-content:space-between}.muted{color:#9da3b8}.hero{font-size:44px;text-align:center;margin:16px}.tabs{display:flex;gap:8px}.tabs button{flex:1}.hidden{display:none}h2{margin:4px 0 12px}</style></head><body><main><div class="logo">✦ NOMERX</div><p class="muted">Твоя коллекция. Твой гараж.</p><div class="panel"><div class="muted">Баланс игрока</div><div class="coins" id="coins">🪙 1 000</div><div class="muted" id="welcome">Добро пожаловать!</div></div><div class="tabs"><button class="btn" onclick="show('garage')">Гараж</button><button class="btn secondary" onclick="show('market')">Контейнеры</button></div><section id="garage" class="panel"><h2>🚘 Мой гараж</h2><div id="cars" class="muted">Загружаем гараж…</div></section><section id="market" class="panel hidden"><h2>🎁 Контейнер NomerX</h2><div class="hero">📦✨</div><p class="muted">Случайная машина внутри. Открытие стоит 100 монет.</p><button class="btn" onclick="openBox()">Открыть контейнер · 100 🪙</button><div id="result"></div></section><p class="muted" style="text-align:center;font-size:12px">NomerX • Игровые монеты не имеют денежной стоимости</p></main><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const u=tg?.initDataUnsafe?.user||{id: "demo",first_name:"Гость"};let player={id:String(u.id),name:u.first_name||"Игрок",coins:1000,garage:[]};async function load(){try{let r=await fetch('/api/player?id='+encodeURIComponent(player.id)+'&name='+encodeURIComponent(player.name));player=await r.json();draw()}catch(e){document.getElementById('cars').textContent='Не удалось загрузить игру. Обнови страницу.'}}function draw(){document.getElementById('coins').textContent='🪙 '+player.coins.toLocaleString('ru-RU');document.getElementById('welcome').textContent='Привет, '+player.name+'!';let el=document.getElementById('cars');if(!player.garage.length){el.innerHTML='Пока пусто. Открой первый контейнер!';return}el.innerHTML=player.garage.map((c,i)=>'<div class="car"><span>🚗 '+c.name+'<br><small class="muted">'+c.rarity+'</small></span><button class="btn secondary" style="width:auto;margin:0;padding:8px" onclick="sell('+i+')">Продать</button></div>').join('')}function show(id){document.getElementById('garage').classList.toggle('hidden',id!=='garage');document.getElementById('market').classList.toggle('hidden',id!=='market')}async function openBox(){let r=await fetch('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:player.id,name:player.name})});let d=await r.json();if(!r.ok){alert(d.error||'Ошибка');return}player=d.player;document.getElementById('result').innerHTML='<div class="panel"><div class="hero">🚘</div><h2>Выпала машина!</h2><b>'+d.car.name+'</b><p class="muted">'+d.car.rarity+'</p></div>';draw()}async function sell(index){let r=await fetch('/api/sell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:player.id,index})});let d=await r.json();if(!r.ok){alert(d.error);return}player.coins=d.coins;player.garage=d.garage;draw()}load();</script></body></html>
